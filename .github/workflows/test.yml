name: CI Tests & Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: TypeScript Lint Check
        run: npm run lint
      - name: Run Test Suite
        run: npm test
      - name: Production Client Build
        run: npm run build
